name: word_learn
description: Academic vocabulary learning app with SRS, CEFR alignment, minimalist design.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Supabase (Auth + Backend)
  supabase_flutter: ^2.5.1

  # Local Storage & Encryption
  sqflite: ^2.3.3
  sqflite_sqlcipher: ^2.2.1
  path: ^1.9.0
  path_provider: ^2.1.3

  # Secure Token Storage
  flutter_secure_storage: ^9.2.2

  # HTTP Client
  dio: ^5.4.3+1

  # Serialization (code-gen)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI Utilities
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Utilities
  equatable: ^2.0.5
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code generation
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/config/
    - assets/images/
    - assets/icons/

  fonts:
    - family: Futura
      fonts:
        - asset: assets/fonts/Futura-Bold.ttf
          weight: 700
        - asset: assets/fonts/Futura-Medium.ttf
          weight: 500
