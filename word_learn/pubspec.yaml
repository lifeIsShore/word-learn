name: word_learn
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.2
  http: ^1.2.1
  encrypt: ^5.0.3
  archive: ^3.6.1
  crypto: ^3.0.3
  path_provider: ^2.1.4
  share_plus: ^10.0.0
  # Session 17: Push Notifications
  # NOTE: firebase_core + firebase_messaging are commented out until
  # google-services.json / GoogleService-Info.plist are configured.
  # Uncomment these AND set AppConfig.devModeSkipFirebase = false after
  # running `flutterfire configure`.
  #
  # firebase_core: ^3.6.0
  # firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Session 18: App icon + splash
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# ── flutter_launcher_icons config ──────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'assets/icon/icon_1024.png'
  # Android adaptive icon
  adaptive_icon_background: '#008B8B'
  adaptive_icon_foreground: 'assets/icon/icon_foreground_1024.png'
  # iOS: remove alpha channel (App Store requirement)
  remove_alpha_ios: true
  # Web (future)
  web:
    generate: false

# ── flutter_native_splash config ───────────────────────────────────────────────
flutter_native_splash:
  # Background colour matches paperWhite
  color: '#FAFAFA'
  color_dark: '#0D1B2A'
  # Centred logo
  image: assets/splash/wordlearn.png
  image_dark: assets/splash/wordlearn_dark.png
  # Android 12+ splash (uses color + icon, no custom image needed)
  android_12:
    color: '#FAFAFA'
    color_dark: '#0D1B2A'
    image: assets/icon/icon_1024.png
    icon_background_color: '#008B8B'
  # iOS
  ios: true
  android: true
  # Don't fullscreen — match app theme
  fullscreen: false

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/splash/
    # ── German ──────────────────────────────────────────────────────────────
    - assets/data/de_a1.csv
    - assets/data/de_a2.csv
    - assets/data/de_b1.csv
    - assets/data/de_b2.csv
    - assets/data/de_c1.csv
    # ── Spanish ─────────────────────────────────────────────────────────────
    - assets/data/es_a1.csv
    - assets/data/es_a2.csv
    - assets/data/es_b1.csv
    - assets/data/es_b2.csv
    # ── French ──────────────────────────────────────────────────────────────
    - assets/data/fr_a1.csv
    - assets/data/fr_a2.csv
    - assets/data/fr_b1.csv
    - assets/data/fr_b2.csv
    # ── Italian ─────────────────────────────────────────────────────────────
    - assets/data/it_a1.csv
    - assets/data/it_a2.csv
    - assets/data/it_b1.csv
    - assets/data/it_b2.csv
    # ── Turkish ─────────────────────────────────────────────────────────────
    - assets/data/tr_a1.csv
    - assets/data/tr_a2.csv
    - assets/data/tr_b1.csv
    - assets/data/tr_b2.csv
    # ── English (as target language) ────────────────────────────────────────
    - assets/data/en_a1.csv
    - assets/data/en_a2.csv
    - assets/data/en_b1.csv
    - assets/data/en_b2.csv
